<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysInsight</title>
<style>
  :root {
    --bg: #2e3440; --panel: #3b4252; --panel2: #434c5e; --line: #4c566a;
    --text: #eceff4; --muted: #d8dee9;
    --blue: #88c0d0; --blue2: #81a1c1; --green: #a3be8c;
    --yellow: #ebcb8b; --orange: #d08770; --red: #bf616a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; color: var(--blue); }
  #status { font-size: 13px; color: var(--muted); }
  main { padding: 24px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted);
             text-transform: uppercase; letter-spacing: .06em; }
  .value { font-size: 34px; font-weight: 600; color: var(--blue); }
</style>
</head>
<body>
<header><h1>SysInsight</h1><div id="status">connecting…</div></header>
<main>
  <div class="card"><h2>CPU</h2><div class="value" id="cpu">–</div></div>
  <div class="card"><h2>RAM</h2><div class="value" id="ram">–</div></div>
  <div class="card"><h2>Load (1 min)</h2><div class="value" id="load">–</div></div>
</main>
<script>
async function refresh() {
  try {
    const r = await fetch("/api/latest");
    const d = await r.json();
    const s = d.sample || d;
    document.getElementById("cpu").textContent = s.cpu_percent != null ? s.cpu_percent.toFixed(1) + "%" : "–";
    document.getElementById("ram").textContent = s.ram_percent != null ? s.ram_percent.toFixed(1) + "%" : "–";
    document.getElementById("load").textContent = s.load_avg_1min != null ? s.load_avg_1min.toFixed(2) : "–";
    document.getElementById("status").textContent = "live · " + (s.timestamp || "");
  } catch (e) {
    document.getElementById("status").textContent = "API unreachable";
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
