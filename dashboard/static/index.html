<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysInsight</title>
<style>
  :root {
    --bg: #2E3440; --panel: #3B4252; --panel2: #434C5E;
    --text: #D8DEE9; --muted: #8f9bb3;
    --blue: #88C0D0; --blue2: #81A1C1;
    --green: #A3BE8C; --yellow: #EBCB8B; --red: #BF616A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--panel2); }
  header h1 { margin: 0; font-size: 20px; color: var(--blue); letter-spacing: 1px; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok::before  { content: "● "; color: var(--green); }
  #status.bad::before { content: "● "; color: var(--red); }
  main { padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--panel2); border-radius: 10px; padding: 18px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .value { font-size: 40px; font-weight: 600; margin: 8px 0 12px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: var(--green); transition: width .4s, background .4s; }
  footer { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>SYSINSIGHT</h1>
  <div id="status" class="bad">connecting…</div>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="label">CPU</div>
      <div class="value" id="cpu-val">--</div>
      <div class="bar"><div class="fill" id="cpu-bar"></div></div></div>
    <div class="card"><div class="label">RAM</div>
      <div class="value" id="ram-val">--</div>
      <div class="bar"><div class="fill" id="ram-bar"></div></div></div>
    <div class="card"><div class="label">Load (1 min)</div>
      <div class="value" id="load-val">--</div></div>
  </div>
  <footer>Last sample: <span id="ts">--</span></footer>
</main>
<script>
  function colorFor(p) { return p >= 85 ? "var(--red)" : p >= 60 ? "var(--yellow)" : "var(--green)"; }

  function setPct(id, v) {
    const val = Number(v);
    document.getElementById(id + "-val").textContent = val.toFixed(1) + "%";
    const bar = document.getElementById(id + "-bar");
    bar.style.width = Math.min(val, 100) + "%";
    bar.style.background = colorFor(val);
  }

  async function refresh() {
    const status = document.getElementById("status");
    try {
      const r = await fetch("/api/latest");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const d = j.sample || j.latest || j;
      setPct("cpu", d.cpu_percent);
      setPct("ram", d.ram_percent);
      document.getElementById("load-val").textContent = Number(d.load_avg_1min).toFixed(2);
      document.getElementById("ts").textContent = d.timestamp;
      status.textContent = "live";
      status.className = "ok";
    } catch (e) {
      status.textContent = "API unreachable";
      status.className = "bad";
    }
  }

  refresh();
  setInterval(refresh, 1000);
</script>
<script src="/static/chart.umd.min.js"></script>
<script src="/static/history_chart.js"></script>

<!-- Step 5: forecast panel -->
<div id="forecast-card" style="margin:16px auto;max-width:900px;padding:16px 20px;background:#3b4252;color:#eceff4;border:1px solid #4c566a;border-radius:8px;font-family:sans-serif;">
  <div style="font-size:13px;color:#d8dee9;letter-spacing:1px;">CPU FORECAST (5 MIN AHEAD)</div>
  <div style="display:flex;gap:40px;margin-top:8px;align-items:flex-end;">
    <div><div style="font-size:12px;color:#d8dee9;">Now</div><div id="fc-now" style="font-size:32px;color:#88c0d0;">--</div></div>
    <div><div style="font-size:12px;color:#d8dee9;">Predicted</div><div id="fc-pred" style="font-size:32px;color:#ebcb8b;">--</div></div>
    <div><div style="font-size:12px;color:#d8dee9;">Change</div><div id="fc-delta" style="font-size:32px;">--</div></div>
  </div>
  <div id="fc-meta" style="margin-top:8px;font-size:12px;color:#81a1c1;">waiting for data...</div>
</div>
<script>
async function updateForecast() {
  try {
    const [pr, lr] = await Promise.all([
      fetch('/api/predictions/latest').then(r => r.json()),
      fetch('/api/latest').then(r => r.json())
    ]);
    const p = pr.prediction || pr;
    const l = lr.sample || lr;
    const pred = Number(p.predicted_cpu);
    const now = Number(l.cpu_percent);
    document.getElementById('fc-now').textContent = isNaN(now) ? '--' : now.toFixed(1) + '%';
    document.getElementById('fc-pred').textContent = isNaN(pred) ? '--' : pred.toFixed(1) + '%';
    const d = document.getElementById('fc-delta');
    if (!isNaN(pred) && !isNaN(now)) {
      const diff = pred - now;
      d.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(1);
      d.style.color = diff > 5 ? '#bf616a' : (diff < -5 ? '#a3be8c' : '#d8dee9');
    }
    document.getElementById('fc-meta').textContent =
      'target time: ' + (p.target_time || '?') + ' | model: ' + (p.model || '?');
  } catch (e) {
    document.getElementById('fc-meta').textContent = 'forecast unavailable';
  }
}
updateForecast();
setInterval(updateForecast, 5000);
</script>

</body>
</html>
