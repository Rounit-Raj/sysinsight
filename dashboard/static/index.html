<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysInsight</title>
<style>
  :root {
    --bg: #2E3440; --panel: #3B4252; --panel2: #434C5E;
    --text: #D8DEE9; --muted: #8f9bb3;
    --blue: #88C0D0; --blue2: #81A1C1;
    --green: #A3BE8C; --yellow: #EBCB8B; --red: #BF616A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--panel2); }
  header h1 { margin: 0; font-size: 20px; color: var(--blue); letter-spacing: 1px; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok::before  { content: "● "; color: var(--green); }
  #status.bad::before { content: "● "; color: var(--red); }
  main { padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--panel2); border-radius: 10px; padding: 18px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .value { font-size: 40px; font-weight: 600; margin: 8px 0 12px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: var(--green); transition: width .4s, background .4s; }
  footer { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
<link rel="stylesheet" href="/static/layout.css">
</head>
<body>
<header>
  <h1>SYSINSIGHT</h1>
  <div id="status" class="bad">connecting…</div>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="label">CPU</div>
      <div class="value" id="cpu-val">--</div>
      <div class="bar"><div class="fill" id="cpu-bar"></div></div></div>
    <div class="card"><div class="label">RAM</div>
      <div class="value" id="ram-val">--</div>
      <div class="bar"><div class="fill" id="ram-bar"></div></div></div>
    <div class="card"><div class="label">Load (1 min)</div>
      <div class="value" id="load-val">--</div></div>
  </div>
  <footer>Last sample: <span id="ts">--</span></footer>
</main>
<script>
  function colorFor(p) { return p >= 85 ? "var(--red)" : p >= 60 ? "var(--yellow)" : "var(--green)"; }

  function setPct(id, v) {
    const val = Number(v);
    document.getElementById(id + "-val").textContent = val.toFixed(1) + "%";
    const bar = document.getElementById(id + "-bar");
    bar.style.width = Math.min(val, 100) + "%";
    bar.style.background = colorFor(val);
  }

  async function refresh() {
    const status = document.getElementById("status");
    try {
      const r = await fetch("/api/latest");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const d = j.sample || j.latest || j;
      setPct("cpu", d.cpu_percent);
      setPct("ram", d.ram_percent);
      document.getElementById("load-val").textContent = Number(d.load_avg_1min).toFixed(2);
      document.getElementById("ts").textContent = d.timestamp;
      status.textContent = "live";
      status.className = "ok";
    } catch (e) {
      status.textContent = "API unreachable";
      status.className = "bad";
    }
  }

  refresh();
  setInterval(refresh, 1000);
</script>
<script src="/static/chart.umd.min.js"></script>
<script src="/static/history_chart.js"></script>

<!-- Step 5: forecast panel -->
<div id="forecast-card" style="margin:16px auto;max-width:900px;padding:16px 20px;background:#3b4252;color:#eceff4;border:1px solid #4c566a;border-radius:8px;font-family:sans-serif;">
  <div style="font-size:13px;color:#d8dee9;letter-spacing:1px;">CPU FORECAST (5 MIN AHEAD)</div>
  <div style="display:flex;gap:40px;margin-top:8px;align-items:flex-end;">
    <div><div style="font-size:12px;color:#d8dee9;">Now</div><div id="fc-now" style="font-size:32px;color:#88c0d0;">--</div></div>
    <div><div style="font-size:12px;color:#d8dee9;">Predicted</div><div id="fc-pred" style="font-size:32px;color:#ebcb8b;">--</div></div>
    <div><div style="font-size:12px;color:#d8dee9;">Change</div><div id="fc-delta" style="font-size:32px;">--</div></div>
  </div>
  <div id="fc-meta" style="margin-top:8px;font-size:12px;color:#81a1c1;">waiting for data...</div>
</div>
<script>
async function updateForecast() {
  try {
    const [pr, lr] = await Promise.all([
      fetch('/api/predictions/latest').then(r => r.json()),
      fetch('/api/latest').then(r => r.json())
    ]);
    const p = pr.prediction || pr;
    const l = lr.sample || lr;
    const pred = Number(p.predicted_cpu);
    const now = Number(l.cpu_percent);
    document.getElementById('fc-now').textContent = isNaN(now) ? '--' : now.toFixed(1) + '%';
    document.getElementById('fc-pred').textContent = isNaN(pred) ? '--' : pred.toFixed(1) + '%';
    const d = document.getElementById('fc-delta');
    if (!isNaN(pred) && !isNaN(now)) {
      const diff = pred - now;
      d.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(1);
      d.style.color = diff > 5 ? '#bf616a' : (diff < -5 ? '#a3be8c' : '#d8dee9');
    }
    document.getElementById('fc-meta').textContent =
      'target time: ' + (p.target_time || '?') + ' | model: ' + (p.model || '?');
  } catch (e) {
    document.getElementById('fc-meta').textContent = 'forecast unavailable';
  }
}
updateForecast();
setInterval(updateForecast, 5000);
</script>

<!-- alerts-panel:start -->
<style>
  #alerts-panel { background:#3b4252; color:#eceff4; border:1px solid #4c566a; border-radius:8px; margin:16px; padding:12px 16px; font-family:system-ui,sans-serif; }
  #alerts-panel h2 { margin:0 0 10px; font-size:16px; color:#88c0d0; display:flex; justify-content:space-between; align-items:center; }
  #alerts-count { background:#434c5e; color:#d8dee9; border-radius:10px; padding:2px 10px; font-size:12px; }
  #alerts-list { max-height:320px; overflow-y:auto; }
  .alert-row { display:flex; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid #434c5e; font-size:13px; }
  .alert-row:last-child { border-bottom:none; }
  .alert-time { color:#81a1c1; font-family:monospace; white-space:nowrap; }
  .alert-sev { font-size:11px; font-weight:600; padding:1px 8px; border-radius:4px; color:#2e3440; white-space:nowrap; }
  .sev-high { background:#bf616a; }
  .sev-medium { background:#ebcb8b; }
  .sev-low { background:#88c0d0; }
  .sev-other { background:#d8dee9; }
  .alert-kind { color:#d8dee9; font-weight:600; white-space:nowrap; }
  .alert-msg { color:#e5e9f0; }
  .alerts-empty { color:#81a1c1; padding:8px 0; font-size:13px; }
</style>
<section id="alerts-panel">
  <h2>Alerts <span id="alerts-count">0</span></h2>
  <div id="alerts-list"><div class="alerts-empty">Loading...</div></div>
</section>
<script>
(function () {
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pick(a, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = a[keys[i]];
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return '';
  }
  function sevClass(s) {
    s = String(s).toLowerCase();
    if (s.indexOf('high') >= 0 || s.indexOf('crit') >= 0) return 'sev-high';
    if (s.indexOf('med') >= 0 || s.indexOf('warn') >= 0) return 'sev-medium';
    if (s.indexOf('low') >= 0 || s.indexOf('info') >= 0) return 'sev-low';
    return 'sev-other';
  }
  async function loadAlerts() {
    var list = document.getElementById('alerts-list');
    var count = document.getElementById('alerts-count');
    try {
      var r = await fetch('/api/alerts?limit=20');
      var data = await r.json();
      var alerts = Array.isArray(data) ? data : (data.alerts || []);
      count.textContent = alerts.length;
      if (alerts.length === 0) {
        list.innerHTML = '<div class="alerts-empty">No alerts</div>';
        return;
      }
      list.innerHTML = alerts.map(function (a) {
        var t = pick(a, ['timestamp', 'time', 'ts', 'created_at']);
        var sev = pick(a, ['severity', 'level']);
        var kind = pick(a, ['type', 'rule', 'kind', 'category', 'name']);
        var msg = pick(a, ['message', 'description', 'detail', 'details', 'text']);
        if (!msg && !kind) msg = JSON.stringify(a);
        return '<div class="alert-row">' +
          '<span class="alert-time">' + esc(t) + '</span>' +
          (sev ? '<span class="alert-sev ' + sevClass(sev) + '">' + esc(sev) + '</span>' : '') +
          (kind ? '<span class="alert-kind">' + esc(kind) + '</span>' : '') +
          '<span class="alert-msg">' + esc(msg) + '</span></div>';
      }).join('');
    } catch (e) {
      list.innerHTML = '<div class="alerts-empty">Could not reach /api/alerts</div>';
    }
  }
  loadAlerts();
  setInterval(loadAlerts, 5000);
})();
</script>
<!-- alerts-panel:end -->

<script src="static/badge.js"></script>
<section id="proc-panel" style="margin:16px;padding:16px;background:#3b4252;border-radius:8px;color:#d8dee9;font-family:inherit;">
  <h2 style="margin:0 0 12px 0;font-size:16px;color:#88c0d0;">Top 5 processes by CPU</h2>
  <table id="proc-table" style="width:100%;border-collapse:collapse;font-size:14px;">
    <thead></thead>
    <tbody></tbody>
  </table>
  <div id="proc-time" style="margin-top:8px;font-size:12px;color:#81a1c1;"></div>
</section>

<script>
const PROC_LABELS = {
  pid: 'PID',
  name: 'Process',
  comm: 'Process',
  command: 'Process',
  cpu_percent: 'CPU %',
  mem_mb: 'Memory (MB)',
  mem_percent: 'Memory %',
  rss_mb: 'Memory (MB)'
};

function procLabel(col) {
  const key = col.toLowerCase();
  if (PROC_LABELS[key]) return PROC_LABELS[key];
  const text = col.replace(/_/g, ' ');
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function procFormat(col, value) {
  const key = col.toLowerCase();
  if (key === 'pid' || key === 'name' || key === 'comm' || key === 'command') return value;
  const num = Number(value);
  if (value === '' || isNaN(num)) return value;
  if (key.indexOf('mb') !== -1) return Math.round(num).toString();
  return num.toFixed(1);
}

async function loadProcesses() {
  try {
    const res = await fetch('/api/processes/latest');
    const data = await res.json();
    if (data.error) return;

    const cols = data.columns.filter(function (c) {
      return c.toLowerCase().indexOf('time') === -1;
    });

    const thead = document.querySelector('#proc-table thead');
    const tbody = document.querySelector('#proc-table tbody');
    thead.textContent = '';
    tbody.textContent = '';

    const headRow = document.createElement('tr');
    cols.forEach(function (col) {
      const th = document.createElement('th');
      th.textContent = procLabel(col);
      th.style.cssText = 'text-align:left;padding:6px 8px;border-bottom:1px solid #4c566a;color:#88c0d0;';
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);

    data.rows.forEach(function (row) {
      const tr = document.createElement('tr');
      cols.forEach(function (col) {
        const td = document.createElement('td');
        td.textContent = procFormat(col, row[col]);
        td.style.cssText = 'padding:6px 8px;border-bottom:1px solid #434c5e;';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    document.getElementById('proc-time').textContent = 'Sampled at ' + data.timestamp;
  } catch (e) {
    console.error('process table failed', e);
  }
}
loadProcesses();
setInterval(loadProcesses, 5000);
</script>
<section id="io-panel" style="margin:16px;padding:16px;background:#3b4252;border-radius:8px;color:#d8dee9;font-family:inherit;">
  <h3 style="margin:0 0 12px 0;">Disk &amp; Network I/O (last 5 min)</h3>
  <div style="display:flex;flex-wrap:wrap;gap:16px;">
    <div style="flex:1 1 320px;height:220px;"><canvas id="disk-io-chart"></canvas></div>
    <div style="flex:1 1 320px;height:220px;"><canvas id="net-io-chart"></canvas></div>
  </div>
</section>
<script>
(function () {
  function makeChart(id, name1, name2, color1, color2, unit) {
    function ds(name, color) {
      return { label: name, data: [], borderColor: color, backgroundColor: color,
               borderWidth: 2, pointRadius: 0, tension: 0.2 };
    }
    return new Chart(document.getElementById(id), {
      type: 'line',
      data: { labels: [], datasets: [ds(name1, color1), ds(name2, color2)] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: '#d8dee9' } } },
        scales: {
          x: { ticks: { color: '#d8dee9', maxTicksLimit: 6 }, grid: { color: '#434c5e' } },
          y: { beginAtZero: true,
               title: { display: true, text: unit, color: '#d8dee9' },
               ticks: { color: '#d8dee9' }, grid: { color: '#434c5e' } }
        }
      }
    });
  }

  var diskChart = makeChart('disk-io-chart', 'Read', 'Write', '#88c0d0', '#ebcb8b', 'MB/s');
  var netChart  = makeChart('net-io-chart', 'Download (rx)', 'Upload (tx)', '#a3be8c', '#bf616a', 'KB/s');

  function fill(chart, labels, a, b) {
    chart.data.labels = labels;
    chart.data.datasets[0].data = a;
    chart.data.datasets[1].data = b;
    chart.update('none');
  }

  async function loadIO() {
    try {
      var r = await fetch('/api/io?minutes=5');
      var rows = await r.json();
      var labels = rows.map(function (x) { return String(x.timestamp).slice(11, 19); });
      fill(diskChart, labels,
           rows.map(function (x) { return x.disk_read_mb_s; }),
           rows.map(function (x) { return x.disk_write_mb_s; }));
      fill(netChart, labels,
           rows.map(function (x) { return x.net_rx_kb_s; }),
           rows.map(function (x) { return x.net_tx_kb_s; }));
    } catch (e) {
      console.error('I/O chart: could not reach /api/io', e);
    }
  }

  loadIO();
  setInterval(loadIO, 2000);
})();
</script>
</body>
</html>
